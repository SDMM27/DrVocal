<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__SCRIPT_HASH__'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'">
<title>Dr Vocal</title>
<style>
  html, body { margin: 0; background: #14161a; color: #e6e6e6; font: 15px/1.4 "Segoe UI", sans-serif; }
  #log { padding: 8px 12px; }
  .ev { margin: 6px 0; padding: 6px 10px; border-left: 3px solid #555; white-space: pre-wrap; overflow-wrap: anywhere; }
  .text { border-color: #6aa9ff; }
  .tool { border-color: #888; color: #aaa; font-family: Consolas, monospace; font-size: 13px; }
  .pending { border-color: #ffb454; background: #2a2418; }
  .pending.resolved { opacity: .5; }
  .done { border-color: #5cc46b; }
  .error { border-color: #ff6b6b; color: #ffb3b3; }
  .actions { margin-top: 6px; }
  button { font: inherit; padding: 6px 16px; margin-right: 8px; border: 0; border-radius: 4px; cursor: pointer; color: #111; }
  button[data-action="approve"] { background: #5cc46b; }
  button[data-action="reject"] { background: #ff6b6b; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div id="log"></div>
<script>
(function () {
  var log = document.getElementById("log");
  var MAX = 200;
  // html est deja echappe cote Python ; il arrive uniquement via addEvent(JSON).
  window.addEvent = function (payload) {
    var div = document.createElement("div");
    div.innerHTML = payload.html;
    var node = div.firstElementChild;
    if (!node) return;
    log.appendChild(node);
    while (log.children.length > MAX) log.removeChild(log.firstChild);
    window.scrollTo(0, document.body.scrollHeight);
  };
  window.markResolved = function (payload) {
    var nodes = log.querySelectorAll(".pending");
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-id") === payload.id) {
        nodes[i].classList.add("resolved");
        var btns = nodes[i].querySelectorAll("button");
        for (var j = 0; j < btns.length; j++) btns[j].disabled = true;
      }
    }
  };
  log.addEventListener("click", function (e) {
    if (!e.isTrusted) return;  // seulement un vrai clic, jamais un clic simule par script
    var btn = e.target.closest ? e.target.closest("button[data-action]") : null;
    if (!btn || btn.disabled) return;
    var item = btn.closest(".pending");
    if (!item || !window.pywebview || !window.pywebview.api) return;
    var id = item.getAttribute("data-id");
    var action = btn.getAttribute("data-action");
    var btns = item.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
    window.pywebview.api.decide(id, action);
  });
})();
</script>
</body>
</html>
