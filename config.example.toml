# Copier ce fichier en config.toml (ignore par git) et l'adapter.
# Les secrets vont dans secrets.toml (ignore par git) : spotify_client_id, discord_bot_token.

# Raccourcis Discord simules (SendInput). DESACTIVE par defaut : lire docs/anti-triche.md avant d'activer.
simulated_hotkeys_enabled = false

# Phrases d'activation (minuscules).
wake_phrases = ["salut doc vocal"]

# Dossier des notes (defaut : Documents/NOTES).
# notes_dir = "C:/Users/moi/Documents/NOTES"

# Reconnaissance vocale : modele faster-whisper et peripherique (cpu ou cuda).
stt_model = "small"
stt_device = "cpu"

# Index du second ecran (0 = ecran principal).
second_screen_index = 1

# Projets : nom parle -> dossier. Les noms sont mis en minuscules au chargement.
[projects]
"Dr Vocal" = "D:/NasaCode/DrVocal"

# Synonymes : phrase dite -> phrase canonique reconnue (enonce entier, minuscules).
[synonyms]
"balance la suivante" = "musique suivante"

# Raccourcis clavier Discord deja configures dans Discord : cles "mute" et "deafen" -> combinaison.
[discord.hotkeys]
mute = "ctrl+shift+m"
deafen = "ctrl+shift+d"

# Bot Discord personnel (voir README / rapport pour la creation du bot).
# Permissions du bot (permissions=30411776 dans l'URL d'invitation, scope bot) : View Channels,
# Send Messages, Mute Members, Deafen Members, Move Members, Connect.
# https://discord.com/oauth2/authorize?client_id=<APPLICATION_ID>&scope=bot&permissions=30411776
# Intents : Server Members Intent active dans le portail developpeur ; pas de Message Content.
[discord]
# Ton identifiant utilisateur Discord : le bot n'agit que dans les serveurs ou tu es membre.
owner_id = 0

# Salons (textuels pour les messages, vocaux pour le deplacement) : nom parle -> identifiant Discord.
# Sans entree ici, le nom doit correspondre exactement (casse et accents ignores) au nom du salon.
[discord.channels]
general = 123456789012345678

# Membres : nom parle -> identifiant Discord.
[discord.members]
alex = 123456789012345678
