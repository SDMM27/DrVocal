# Copier ce fichier en %APPDATA%\DrVocal\config.toml et l'adapter.
# Les secrets (spotify_client_id, jeton Discord, jeton Spotify) ne vont plus dans un fichier : ils sont
# chiffres (DPAPI) dans %LOCALAPPDATA%\DrVocal\secrets. Un ancien secrets.toml ou .spotify-cache a la racine
# du depot est importe automatiquement au premier lancement, puis supprime.

# Version du format de ce fichier (migree automatiquement).
schema_version = 1

# Raccourcis Discord simules (SendInput). DESACTIVE par defaut : lire docs/anti-triche.md avant d'activer.
simulated_hotkeys_enabled = false

# Phrases d'activation (minuscules).
wake_phrases = ["salut doc vocal"]

# Mode de reveil : "key" (touche ou bouton a maintenir pour parler, defaut tant que le modele
# vocal n'est pas valide) ou "voice" (mot de reveil). Autre valeur : erreur.
wake_mode = "key"

# Touche ou bouton a maintenir en mode "key" : mouse3, mouse4, mouse5, une lettre, F1-F24, space...
# Choisir une touche ou un bouton NON utilise dans les jeux. Le jeu recoit toujours la touche :
# Dr Vocal se contente de lire son etat (voir docs/anti-triche.md), il ne l'intercepte pas.
push_to_talk_key = "mouse5"

# Modeles de mot de reveil (*.onnx), relatif a la racine du projet. Sans modele, repli sur la touche.
wake_models_dir = "models/wake"

# Seuil de detection du mot de reveil (mesure du 2026-11-03, voir docs/mesures.md).
wake_threshold = 0.9

# Voix Piper pour les lectures (messages Discord, questions de Claude), relatif a la racine du projet.
tts_voice = "models/piper/fr_FR-siwis-medium.onnx"

# Dossier des notes (defaut : Documents/NOTES).
# notes_dir = "C:/Users/moi/Documents/NOTES"

# Reconnaissance vocale : modele faster-whisper et peripherique (cpu ou cuda).
stt_model = "small"
stt_device = "cpu"

# Journal local des commandes (texte, action, resultat, WAV des echecs seulement) dans
# %LOCALAPPDATA%/DrVocal/commands. Mettre false pour le desactiver.
# command_log = true

# Vocabulaire transmis a la transcription (noms de projets, salons, membres, Spotify).
# stt_hotwords = true

# Noms propres mal transcrits : prioritaires sur ceux tires des projets/salons/membres/Spotify
# (~400 caracteres au total, le reste est ignore).
# stt_vocabulary = ["Dr Vocal", "Daft Punk"]

# Chemin de claude.exe (Claude Code), si absent du PATH. Les commandes Claude exigent Claude Code.
# claude_command = "C:/Users/moi/.local/bin/claude.exe"

# Index du second ecran (0 = ecran principal).
second_screen_index = 1

# Projets : nom parle -> dossier. Les noms sont mis en minuscules au chargement.
[projects]
"Dr Vocal" = "D:/NasaCode/DrVocal"
"GeoGame" = "D:/NasaCode/GeoGame"

# Synonymes : phrase dite -> phrase canonique reconnue (enonce entier, minuscules).
[synonyms]
"balance la suivante" = "musique suivante"

# Raccourcis clavier Discord deja configures dans Discord : cles "mute" et "deafen" -> combinaison.
[discord.hotkeys]
mute = "ctrl+shift+m"
deafen = "ctrl+shift+d"

# Bot Discord personnel (voir README / rapport pour la creation du bot).
# Permissions du bot (permissions=30411776 dans l'URL d'invitation, scope bot) : View Channels,
# Send Messages, Mute Members, Deafen Members, Move Members, Connect.
# https://discord.com/oauth2/authorize?client_id=<APPLICATION_ID>&scope=bot&permissions=30411776
# Intents : Server Members Intent active dans le portail developpeur ; pas de Message Content.
[discord]
# Ton identifiant utilisateur Discord : le bot n'agit que dans les serveurs ou tu es membre.
owner_id = 0

# Salons (textuels pour les messages, vocaux pour le deplacement) : nom parle -> identifiant Discord.
# Sans entree ici, le nom doit correspondre exactement (casse et accents ignores) au nom du salon.
[discord.channels]
general = 123456789012345678

# Membres : nom parle -> identifiant Discord.
[discord.members]
alex = 123456789012345678

# Sons personnalises (WAV), facultatif : wake, success, failure, done. Sinon bips integres.
# [sounds]
# wake = "C:/Users/moi/sons/wake.wav"
