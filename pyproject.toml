[project]
name = "drvocal"
version = "0.1.0"
description = "Assistant vocal local en francais pour Windows"
readme = "README.md"
authors = [
    { name = "SachDn", email = "72878858+SDMM27@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
